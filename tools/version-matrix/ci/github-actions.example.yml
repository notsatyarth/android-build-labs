# EXAMPLE ONLY (documentation). Not installed anywhere, never run by the agent that wrote it.
# Copy to .github/workflows/version-matrix.yml in a repo that contains the harness and the app (or checks both out).
name: version-matrix-shadow
on:
  schedule: [{cron: "0 2 * * *"}]   # nightly, the "Shadow Jobs" pattern (Slack Engineering blog, 2021)
  workflow_dispatch:
jobs:
  cell:
    runs-on: ubuntu-latest          # Linux avoids macOS memory compression skewing RSS numbers
    strategy:
      fail-fast: false              # every cell reports, even when another breaks
      matrix:
        cell: [baseline, gradle-next, agp-next, kotlin-next, flag-simulate-agp10]
    steps:
      - uses: actions/checkout@v4
        with: {path: harness}       # this repo (tools/version-matrix)
      - uses: actions/checkout@v4
        with: {repository: android/nowinandroid, path: app, ref: main}   # pin a commit for stable results
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}   # any 3.9+; the harness has no pip dependencies
      - name: Run one cell
        run: |
          python3 harness/tools/version-matrix/vmatrix.py run \
            --config harness/tools/version-matrix/matrix.example.json \
            --project app --cells "${{ matrix.cell }}" \
            --out out --fail-on invalid --json > out-summary.json
        # --fail-on invalid: the job is red only when the version guard fails (harness problem).
        # A cell that FAILs is the expected finding, not a CI error. Use --fail-on any to go red on it too.
      - run: cat out/report.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "vmatrix-${{ matrix.cell }}", path: out}
