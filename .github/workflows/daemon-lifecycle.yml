# Which processes of a nowinandroid build end with the build, and what ends the others (idle timeouts, --stop, --no-daemon)?
# One job per cell (labs/daemon-lifecycle/run.sh), then compare.py over all cells. procwatch samples every second, with a
# long tail after the build. Results are x86 Linux runner numbers.
name: daemon-lifecycle
on:
  workflow_dispatch:
    inputs:
      nia_ref:
        description: "nowinandroid commit (full SHA)"
        required: false
        default: "2982e63cb691ad49cd009aab43dc206fee6699c2"
permissions:
  contents: read
jobs:
  cell:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cell: [a1a2, a3, a4, a5, a6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Runner info
        run: bash .github/scripts/runner_info.sh
      - name: Clone nowinandroid
        env:
          REF: ${{ inputs.nia_ref }}
        run: bash .github/scripts/clone_nia.sh "$RUNNER_TEMP/nia" "$REF" && git -C "$RUNNER_TEMP/nia" config user.email ci@example.invalid && git -C "$RUNNER_TEMP/nia" config user.name ci
      - name: Warm-up build (downloads dependencies so the measured build does not)
        working-directory: ${{ runner.temp }}/nia
        run: ./gradlew :app:assembleDemoDebug --console=plain -q && ./gradlew --stop
      - name: Cell ${{ matrix.cell }}
        run: bash labs/daemon-lifecycle/run.sh "$RUNNER_TEMP/nia" "out/${{ matrix.cell }}" "${{ matrix.cell }}"
      - name: Print cell files (artifact download is not always possible, so the evidence is also in the log)
        if: always()
        run: |
          for f in out/${{ matrix.cell }}/*.txt out/${{ matrix.cell }}/*.meta.json out/${{ matrix.cell }}/*.build_end out/${{ matrix.cell }}/*.stop_at; do
            [ -f "$f" ] && { echo "== $f"; cat "$f"; }
          done; true
      - name: This cell alone
        if: always()
        run: python3 -I labs/daemon-lifecycle/compare.py "out/${{ matrix.cell }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: daemon-lifecycle-${{ matrix.cell }}
          path: out/
          retention-days: 30
  compare:
    needs: cell
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: parts
      - name: Compare
        run: |
          set -o pipefail
          echo "## Daemon lifecycle (CI: x86 Linux runner)" >> "$GITHUB_STEP_SUMMARY"
          python3 -I labs/daemon-lifecycle/compare.py parts | tee -a "$GITHUB_STEP_SUMMARY"
