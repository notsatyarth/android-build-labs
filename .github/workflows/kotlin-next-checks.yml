# Kotlin tryNext vs progressive mode on nowinandroid, Kotlin 2.3.0 and 2.4.21 (labs/kotlin-next-checks).
# One job per cell; a failing build is a result. The compare job checks the predictions in compare.py.
name: kotlin-next-checks
on:
  workflow_dispatch:
    inputs:
      nia_ref:
        description: "nowinandroid commit (full SHA)"
        required: false
        default: "2982e63cb691ad49cd009aab43dc206fee6699c2"
      kotlin_versions:
        description: "Comma-separated Kotlin versions"
        required: false
        default: "2.3.0,2.4.21"
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.p.outputs.cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: p
        env:
          KOTLIN: ${{ inputs.kotlin_versions }}
        run: echo "cells=$(python3 labs/kotlin-next-checks/make_config.py --kotlin "$KOTLIN" --list-cells)" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        cell: ${{ fromJSON(needs.plan.outputs.cells) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Clone nowinandroid
        env:
          REF: ${{ inputs.nia_ref }}
        run: bash .github/scripts/clone_nia.sh "$RUNNER_TEMP/nia" "$REF" && git -C "$RUNNER_TEMP/nia" config user.email ci@example.invalid && git -C "$RUNNER_TEMP/nia" config user.name ci
      - name: Build this cell
        env:
          KOTLIN: ${{ inputs.kotlin_versions }}
          CELL: ${{ matrix.cell }}
        run: |
          python3 labs/kotlin-next-checks/make_config.py "$RUNNER_TEMP/m.json" --kotlin "$KOTLIN"
          python3 tools/version-matrix/vmatrix.py run --config "$RUNNER_TEMP/m.json" --project "$RUNNER_TEMP/nia" --cells "$CELL" --out out --offline --fail-on never
      - name: Excerpt
        if: always()
        run: python3 labs/flag-builds/excerpt.py out | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cell-${{ matrix.cell }}
          path: |
            out/report.json
            out/*/cell.json
            out/*/*.log
          retention-days: 30
  compare:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: parts
      - name: Compare with predictions
        run: |
          set -o pipefail
          python3 labs/kotlin-next-checks/compare.py parts | tee -a "$GITHUB_STEP_SUMMARY"
