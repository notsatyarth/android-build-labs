# Extra Kotlin daemon 2x2 on nowinandroid: Kotlin version of the project (2.3.0 vs 2.4.0, which is what Gradle 9.7.1 embeds for
# build-logic) times matching kotlin.daemon.jvmargs in build-logic. Counts distinct Kotlin daemon processes per clean build.
name: extra-kotlin-daemon
on:
  workflow_dispatch:
    inputs:
      nia_ref:
        description: "nowinandroid commit (full SHA)"
        required: false
        default: "2982e63cb691ad49cd009aab43dc206fee6699c2"
permissions:
  contents: read
jobs:
  daemons:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Runner info
        run: bash .github/scripts/runner_info.sh
      - name: Clone nowinandroid
        env:
          REF: ${{ inputs.nia_ref }}
        run: bash .github/scripts/clone_nia.sh "$RUNNER_TEMP/nia" "$REF" && git -C "$RUNNER_TEMP/nia" config user.email ci@example.invalid && git -C "$RUNNER_TEMP/nia" config user.name ci
      - name: Four runs
        run: bash labs/extra-kotlin-daemon/run.sh "$RUNNER_TEMP/nia" out
      - name: Compare with macOS
        if: always()
        run: |
          echo "### Extra Kotlin daemon 2x2 (CI: x86 Linux runner)" >> "$GITHUB_STEP_SUMMARY"
          python3 -I labs/extra-kotlin-daemon/compare.py out | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: extra-kotlin-daemon
          path: out/
          retention-days: 30
