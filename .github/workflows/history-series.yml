# Build nowinandroid at several commits (one job per commit, per-cell ref in the harness) and combine the per-commit
# results, including the configuration cache, deprecation and Isolated Projects probes, into history.json. A commit that fails to build is a
# result, not a workflow failure.
name: history-series
on:
  workflow_dispatch:
    inputs:
      shas:
        description: "space-separated full nowinandroid commit SHAs, oldest first"
        required: true
        default: "cf441fbbc69c0aa80d159ae4a26687446abb68e1 2982e63cb691ad49cd009aab43dc206fee6699c2"
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      shas: ${{ steps.p.outputs.shas }}
    steps:
      - id: p
        env:
          SHAS: ${{ inputs.shas }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, re
          shas = os.environ["SHAS"].split()
          assert shas and all(re.fullmatch(r"[0-9a-f]{40}", s) for s in shas), "need full 40-character SHAs"
          print("shas=" + json.dumps(shas))
          PY
  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        sha: ${{ fromJSON(needs.plan.outputs.shas) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch the commit
        env:
          SHA: ${{ matrix.sha }}
        run: |
          set -eu
          git init -q "$RUNNER_TEMP/nia"
          git -C "$RUNNER_TEMP/nia" fetch -q --depth 1 https://github.com/android/nowinandroid "$SHA"
          git -C "$RUNNER_TEMP/nia" checkout -q FETCH_HEAD
          git -C "$RUNNER_TEMP/nia" config user.email ci@example.invalid
          git -C "$RUNNER_TEMP/nia" config user.name ci
          mkdir -p out
          python3 - "$SHA" "$RUNNER_TEMP/nia" > out/meta.json <<'PY'
          import json, subprocess, sys
          sha, repo = sys.argv[1], sys.argv[2]
          g = lambda *a: subprocess.run(["git", "-C", repo] + list(a), capture_output=True, text=True).stdout.strip()
          print(json.dumps({"sha": sha, "date": g("show", "-s", "--format=%cI", sha), "subject": g("show", "-s", "--format=%s", sha)}))
          PY
          python3 labs/history-series/make_config.py "$RUNNER_TEMP/matrix.json" "$SHA"
          python3 labs/history-series/make_config.py --ip "$RUNNER_TEMP/matrix-ip.json" "$SHA"
      - name: Run
        run: python3 tools/version-matrix/vmatrix.py run --config "$RUNNER_TEMP/matrix.json" --project "$RUNNER_TEMP/nia" --out out --offline --fail-on never
      - name: Run with Isolated Projects on
        # Second build of the same commit: configuration only (help), IP forced on. IP problems are a result, not a failure.
        # Output goes under out/ip so the artifact layout of the first run does not change.
        run: python3 tools/version-matrix/vmatrix.py run --config "$RUNNER_TEMP/matrix-ip.json" --project "$RUNNER_TEMP/nia" --out out/ip --offline --fail-on never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: commit-${{ matrix.sha }}
          path: |
            out/meta.json
            out/report.json
            out/*/cell.json
            out/*/*.log
            out/*/problems-report.html
            out/*/configuration-cache-report.html
            out/ip/report.json
            out/ip/*/cell.json
            out/ip/*/*.log
            out/ip/*/configuration-cache-report.html
          retention-days: 30
  aggregate:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: parts
      - name: Combine
        run: |
          set -eo pipefail
          mkdir -p out
          python3 labs/history-series/aggregate_history.py parts out/history.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: history-json
          path: out/history.json
          retention-days: 90
