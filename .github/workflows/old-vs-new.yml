# Old versus new nowinandroid (three commit pairs): configuration time, clean build, non-ABI incremental build
# (gradle-profiler 0.26.0), peak RSS and release APK size, each commit with its own wrapper and plugin versions.
# One job per pair; old then new on the same runner. Numbers are x86 Linux runner numbers: compare directions, not values.
name: old-vs-new
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "measured iterations per scenario"
        required: false
        default: "3"
      rounds:
        description: "1 = old then new, 2 = also new then old"
        required: false
        default: "1"
permissions:
  contents: read
jobs:
  pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pair: p1, old: c5b604f72, new: 83d6dbb85, what: "AGP 8.12.2 to 8.13.0, Kotlin 2.1.10 to 2.2.20, Gradle 9.0.0 to 9.1.0"}
          - {pair: p2, old: ade8065442, new: 2c56ce13b, what: "AGP 8.13.1 to 9.0.0 (migration branch merge), Gradle 9.2.1"}
          - {pair: p3, old: 7d45eae4f, new: 94571e675, what: "AGP 9.0.0 to 9.3.2, Gradle 9.4.0 to 9.7.1"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Runner info
        run: bash .github/scripts/runner_info.sh
      - name: Run the pair
        env:
          WORK: ${{ runner.temp }}/ovn
          ITER: ${{ inputs.iterations }}
          ROUNDS: ${{ inputs.rounds }}
        run: bash labs/old-vs-new/ci_run.sh ${{ matrix.pair }}
      - name: Report
        if: always()
        env:
          WORK: ${{ runner.temp }}/ovn
        run: |
          {
            echo "### Old vs new, ${{ matrix.old }} to ${{ matrix.new }}: ${{ matrix.what }} (CI: x86 Linux runner)"
            python3 -I labs/old-vs-new/compare.py "$WORK/profiler-out" ${{ matrix.old }} ${{ matrix.new }}
            echo
            echo "Peak RSS (clean build, summed JVMs) and release APK size:"
            for c in ${{ matrix.old }} ${{ matrix.new }}; do
              tail -n 6 "$WORK/profiler-out/rss-$c.log" 2>/dev/null | grep -E "peak total|peak RSS" | sed "s/^/- $c: /"
              f=$(find "$WORK/wt-$c/app/build/outputs/apk/demo/release" -name '*.apk' 2>/dev/null | head -1); [ -n "$f" ] && echo "- $c release APK: $(stat -c %s "$f") bytes"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: old-vs-new-${{ matrix.pair }}
          path: |
            ${{ runner.temp }}/ovn/profiler-out/**/benchmark.csv
            ${{ runner.temp }}/ovn/profiler-out/*.log
            ${{ runner.temp }}/ovn/profiler-out/*.csv
            ${{ runner.temp }}/ovn/profiler-out/*.txt
            ${{ runner.temp }}/ovn/profiler-out/agg.json
          retention-days: 30
