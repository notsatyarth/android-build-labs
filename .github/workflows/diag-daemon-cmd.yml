# Temporary diagnostic: how do the Gradle and Kotlin daemon command lines look on the runner?
name: diag-daemon-cmd
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Clone nowinandroid
        run: bash .github/scripts/clone_nia.sh "$RUNNER_TEMP/nia" 2982e63cb691ad49cd009aab43dc206fee6699c2
      - name: Build and inspect daemons
        working-directory: ${{ runner.temp }}/nia
        run: |
          echo "JAVA_HOME=$JAVA_HOME; realpath=$(readlink -f $JAVA_HOME)"
          ls gradle; cat gradle/gradle-daemon-jvm.properties 2>/dev/null || true
          ./gradlew help --console=plain "-Dorg.gradle.jvmargs=-Xmx1g -Xlog:gc:file=/tmp/g.log" > /tmp/help.log 2>&1 || tail -20 /tmp/help.log
          ps -eo pid,command | grep -E "GradleDaemon|KotlinCompileDaemon" | grep -v grep | cut -c1-400
          for p in $(pgrep -f GradleDaemon); do echo "exe: $(readlink -f /proc/$p/exe)"; done
