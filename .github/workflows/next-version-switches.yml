# The "next version" switches on nowinandroid (AGP 9.3.2, Gradle 9.7.1, KGP 2.3.0): android.simulateAgpVersionBehavior,
# the AGP opt-outs, kotlin.experimental.tryNext, a Gradle feature preview, properties in build-logic/gradle.properties,
# the kotlin.android plugin on AGP 9. Compared with the original macOS logs.
name: next-version-switches
on:
  workflow_dispatch:
    inputs:
      nia_ref:
        description: "nowinandroid commit (full SHA)"
        required: false
        default: "2982e63cb691ad49cd009aab43dc206fee6699c2"
permissions:
  contents: read
jobs:
  switches:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            17
      - name: Runner info
        run: |
          bash .github/scripts/runner_info.sh
          echo "JAVA17_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "JAVA21_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Clone nowinandroid
        env:
          REF: ${{ inputs.nia_ref }}
        run: bash .github/scripts/clone_nia.sh "$RUNNER_TEMP/nia" "$REF"
      - name: Run the experiments
        run: bash labs/next-version-switches/run.sh "$RUNNER_TEMP/nia" out
      - name: Compare with macOS logs
        if: always()
        run: |
          echo "### Next-version switches on nowinandroid (CI: x86 Linux runner)" >> "$GITHUB_STEP_SUMMARY"
          python3 -I labs/next-version-switches/compare.py out | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: next-version-switches-logs
          path: out/
          retention-days: 30
