# Share of task time per tool (Gradle core, AGP, KGP/Kotlin, KSP, Hilt) on nowinandroid :app:assembleDemoDebug,
# from Gradle's build operation trace, in four scenarios. Compared with the original macOS runs (shares, not seconds).
name: time-share
on:
  workflow_dispatch:
    inputs:
      nia_ref:
        description: "nowinandroid commit (full SHA)"
        required: false
        default: "2982e63cb691ad49cd009aab43dc206fee6699c2"
      measured:
        description: "measured builds per scenario"
        required: false
        default: "5"
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Runner info
        run: bash .github/scripts/runner_info.sh
      - name: Clone nowinandroid
        env:
          REF: ${{ inputs.nia_ref }}
        run: bash .github/scripts/clone_nia.sh "$RUNNER_TEMP/nia" "$REF" && git -C "$RUNNER_TEMP/nia" config user.email ci@example.invalid && git -C "$RUNNER_TEMP/nia" config user.name ci
      - name: Scenarios
        env:
          LAB: ${{ runner.temp }}/nia
          TMPDIR_TS: ${{ runner.temp }}/time-share
          N: ${{ inputs.measured }}
        working-directory: labs/time-share
        run: |
          ./run_traced.sh clean-cc 1 "$N"
          ./run_traced.sh clean-nocc 1 "$N"
          ./run_traced.sh nonabi 2 "$N"
          ./run_traced.sh abi 2 "$N"
      - name: Report
        if: always()
        working-directory: labs/time-share
        run: |
          {
            echo "### Time share per tool, nowinandroid (CI: x86 Linux runner)"
            for s in clean-cc clean-nocc nonabi abi; do python3 -I attribute.py report raw/$s-[0-9]*.json --label "$s" 2>/dev/null || true; echo; done
            echo "#### Compared with the macOS runs"
            python3 -I compare.py raw
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: time-share-raw
          path: labs/time-share/raw/
          retention-days: 30
