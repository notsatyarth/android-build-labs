# One vs two Kotlin daemons on nowinandroid across Kotlin daemon -Xms and -Xmx, Kotlin version held constant (2.4.0), plus the
# shipped setup. One job per cell (labs/daemon-count-matrix/run.sh, N clean builds each), then compare.py over all cells.
# Results are x86 Linux runner numbers: compare cells with each other, not with laptop numbers.
name: daemon-count-matrix
on:
  workflow_dispatch:
    inputs:
      nia_ref:
        description: "nowinandroid commit (full SHA)"
        required: false
        default: "2982e63cb691ad49cd009aab43dc206fee6699c2"
      builds:
        description: "clean builds per cell"
        required: false
        default: "5"
      cells:
        description: "space-separated cells (default: all nine)"
        required: false
        default: "d1_lo_2g d2_lo_2g d1_hi_2g d2_hi_2g d1_lo_4g d2_lo_4g d1_hi_4g d2_hi_4g shipped_4g"
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.p.outputs.cells }}
    steps:
      - id: p
        env:
          CELLS: ${{ inputs.cells }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, re
          cells = os.environ["CELLS"].split()
          assert cells and all(re.fullmatch(r"d[12]_(lo|hi)_[24]g|shipped_4g", c) for c in cells), "unknown cell"
          print("cells=" + json.dumps(cells))
          PY
  cell:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.plan.outputs.cells) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Runner info
        run: bash .github/scripts/runner_info.sh
      - name: Clone nowinandroid
        env:
          REF: ${{ inputs.nia_ref }}
        run: bash .github/scripts/clone_nia.sh "$RUNNER_TEMP/nia" "$REF" && git -C "$RUNNER_TEMP/nia" config user.email ci@example.invalid && git -C "$RUNNER_TEMP/nia" config user.name ci
      - name: Cell ${{ matrix.cell }}
        env:
          N: ${{ inputs.builds }}
        run: |
          bash labs/daemon-count-matrix/run.sh "$RUNNER_TEMP/nia" "out/${{ matrix.cell }}" "${{ matrix.cell }}" "$N"
      - name: This cell alone
        if: always()
        run: |
          for f in out/${{ matrix.cell }}/run*.kotlin-daemons.txt; do echo "== $f"; cut -c1-400 "$f"; done
          python3 -I labs/daemon-count-matrix/compare.py "out/${{ matrix.cell }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: daemon-count-${{ matrix.cell }}
          path: out/
          retention-days: 30
  compare:
    needs: cell
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: parts
      - name: Compare
        run: |
          set -o pipefail
          echo "## One vs two Kotlin daemons (CI: x86 Linux runner)" >> "$GITHUB_STEP_SUMMARY"
          python3 -I labs/daemon-count-matrix/compare.py parts | tee -a "$GITHUB_STEP_SUMMARY"
