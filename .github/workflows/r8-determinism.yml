# Is R8 deterministic, and when do obfuscated field names change (Gson without @SerializedName)?
# Runs labs/r8-determinism/run.py (Android release builds with AGP and R8, plus a JVM round trip with the
# same R8 jar) and checks the hypotheses with compare.py.
name: r8-determinism
on:
  workflow_dispatch:
    inputs:
      only:
        description: "parts to run: android,jvm (empty: both)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Runner info
        run: bash .github/scripts/runner_info.sh
      - name: Run
        working-directory: labs/r8-determinism
        env:
          ONLY: ${{ inputs.only }}
        run: python3 -I run.py --logs logs ${ONLY:+--only "$ONLY"}
      - name: Report
        if: always()
        working-directory: labs/r8-determinism
        run: |
          {
            echo "### R8 determinism and Gson field names (CI: x86 Linux runner)"
            python3 -I compare.py logs --markdown
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: r8-determinism-logs
          path: labs/r8-determinism/logs/
          retention-days: 30
