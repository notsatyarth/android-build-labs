# Kotlin readiness probes on nowinandroid (labs/kotlin-readiness): every Kotlin compile task, four cells
# (A current plain, B current tryNext, C next compiler with language 2.4, D next plain). One job per cell; a failing
# build is a result. Each cell uploads diagnostics.json (one record per compiler diagnostic); the aggregate job merges
# them into readiness.json, compares the cells and checks the predictions.
name: kotlin-readiness
on:
  workflow_dispatch:
    inputs:
      nia_ref:
        description: "nowinandroid commit (full SHA)"
        required: false
        default: "2982e63cb691ad49cd009aab43dc206fee6699c2"
      current:
        description: "Current Kotlin version (cells A and B)"
        required: false
        default: "2.4.21"
      next:
        description: "Next Kotlin version (cells C and D)"
        required: false
        default: "2.5.0-RC"
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      cells: ${{ steps.p.outputs.cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: p
        env:
          CUR: ${{ inputs.current }}
          NEXT: ${{ inputs.next }}
        run: echo "cells=$(python3 labs/kotlin-readiness/make_config.py --current "$CUR" --next "$NEXT" --list-cells)" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        cell: ${{ fromJSON(needs.plan.outputs.cells) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Clone nowinandroid
        env:
          REF: ${{ inputs.nia_ref }}
        run: bash .github/scripts/clone_nia.sh "$RUNNER_TEMP/nia" "$REF" && git -C "$RUNNER_TEMP/nia" config user.email ci@example.invalid && git -C "$RUNNER_TEMP/nia" config user.name ci
      - name: Build this cell
        env:
          CUR: ${{ inputs.current }}
          NEXT: ${{ inputs.next }}
          CELL: ${{ matrix.cell }}
        run: |
          python3 labs/kotlin-readiness/make_config.py "$RUNNER_TEMP/m.json" --current "$CUR" --next "$NEXT"
          python3 tools/version-matrix/vmatrix.py run --config "$RUNNER_TEMP/m.json" --project "$RUNNER_TEMP/nia" --cells "$CELL" --out out --offline --fail-on never
      - name: Extract diagnostics
        if: always()
        env:
          CELL: ${{ matrix.cell }}
        run: python3 labs/kotlin-readiness/extract.py "out/$CELL" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Excerpt
        if: always()
        run: python3 labs/flag-builds/excerpt.py out | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cell-${{ matrix.cell }}
          path: |
            out/report.json
            out/*/cell.json
            out/*/diagnostics.json
            out/*/*.log
          retention-days: 90
  aggregate:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: parts
      - name: Aggregate and check predictions
        env:
          RUN_ID: ${{ github.run_id }}
          NIA: ${{ inputs.nia_ref }}
        run: |
          set -o pipefail
          python3 labs/kotlin-readiness/aggregate.py parts readiness.json --run-id "$RUN_ID" --harness-sha "$GITHUB_SHA" --nia-sha "$NIA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: readiness
          path: readiness.json
          retention-days: 90
