# Capture real Gradle outputs from nowinandroid (configuration cache report, Isolated Projects report,
# deprecation log) as parser test inputs for the feature compatibility probes. Failures are results.
name: capture-samples
on:
  workflow_dispatch:
    inputs:
      nia_ref:
        description: "nowinandroid commit (full SHA)"
        required: false
        default: "2982e63cb691ad49cd009aab43dc206fee6699c2"
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Runner info
        run: bash .github/scripts/runner_info.sh
      - name: Clone nowinandroid
        env:
          REF: ${{ inputs.nia_ref }}
        run: bash .github/scripts/clone_nia.sh "$RUNNER_TEMP/nia" "$REF"
      - name: Capture
        run: bash labs/capture-samples/run.sh "$RUNNER_TEMP/nia" out | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: capture-samples
          path: out/
          retention-days: 30
