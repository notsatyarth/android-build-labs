# missingDimensionStrategy in an intermediate library: replays checkpoints 1 to 5 of the original lab
# (samples/missing-dimension/checkpoints.py writes each checkpoint's build files, runs Gradle, checks
# the outcome) and compares each with the original macOS run (checkpoints.json).
name: missing-dimension
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated checkpoint ids (empty = all: 1,1b,2,3,4,5)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  checkpoints:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Runner info
        run: bash .github/scripts/runner_info.sh
      - name: Run checkpoints
        working-directory: samples/missing-dimension
        env:
          ONLY: ${{ inputs.only }}
        run: |
          echo "### missingDimensionStrategy checkpoints (AGP 9.3.2, Gradle 9.7.1, CI: x86 Linux runner)" >> "$GITHUB_STEP_SUMMARY"
          python3 checkpoints.py ${ONLY:+--only "$ONLY"} --logs logs --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: missing-dimension-logs
          path: samples/missing-dimension/logs/
          retention-days: 30
