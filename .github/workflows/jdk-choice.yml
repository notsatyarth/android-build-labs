# Which JDK does each Java-version choice in an Android build end up using (toolchain, Daemon JVM criteria,
# JAVA_HOME, PATH, Foojay download)? Runs labs/jdk-choice/run.py.
name: jdk-choice
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated cells (empty = all k01..k10)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            17
      - name: Runner info
        run: bash .github/scripts/runner_info.sh
      - name: Run
        working-directory: labs/jdk-choice
        env:
          ONLY: ${{ inputs.only }}
        run: |
          echo "### JDK choice (CI: x86 Linux runner)" >> "$GITHUB_STEP_SUMMARY"
          python3 run.py ${ONLY:+--only "$ONLY"} --logs logs --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jdk-choice-logs
          path: labs/jdk-choice/logs/
          retention-days: 30
