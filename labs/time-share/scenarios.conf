# gradle-profiler scenarios for the untraced wall-time and configuration-time benchmark (same builds as run_traced.sh)
clean_cc {
    tasks = [":app:assembleDemoDebug"]
    gradle-args = ["--no-build-cache", "--rerun-tasks"]
    warm-ups = 1
    iterations = 5
}
clean_nocc {
    tasks = [":app:assembleDemoDebug"]
    gradle-args = ["--no-build-cache", "--rerun-tasks", "--no-configuration-cache", "--no-isolated-projects"]
    warm-ups = 1
    iterations = 5
}
nonabi {
    tasks = [":app:assembleDemoDebug"]
    gradle-args = ["--no-build-cache"]
    apply-non-abi-change-to = "core/model/src/main/kotlin/com/google/samples/apps/nowinandroid/core/model/data/Topic.kt"
    warm-ups = 2
    iterations = 5
}
abi {
    tasks = [":app:assembleDemoDebug"]
    gradle-args = ["--no-build-cache"]
    apply-abi-change-to = "core/model/src/main/kotlin/com/google/samples/apps/nowinandroid/core/model/data/Topic.kt"
    warm-ups = 2
    iterations = 5
}
