config {
    tasks = ["help"]
    gradle-args = ["--no-build-cache", "--no-configuration-cache"]
    warm-ups = 2
    iterations = 5
}
clean {
    tasks = [":app:assembleDemoDebug"]
    gradle-args = ["--no-build-cache", "--rerun-tasks", "--no-configuration-cache"]
    warm-ups = 1
    iterations = 5
}
nonabi {
    tasks = [":app:assembleDemoDebug"]
    gradle-args = ["--no-build-cache", "--no-configuration-cache"]
    apply-non-abi-change-to = "core/model/src/main/kotlin/com/google/samples/apps/nowinandroid/core/model/data/Topic.kt"
    warm-ups = 2
    iterations = 5
}
