import com.google.samples.apps.nowinandroid.NiaFlavorKt

plugins {
    alias(libs.plugins.baselineprofile)
    alias(libs.plugins.nowinandroid.android.test)
}

android {
    namespace = "com.google.samples.apps.nowinandroid.benchmarks"

    defaultConfig {
        minSdk = 28
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField("String", "APP_BUILD_TYPE_SUFFIX", "\"\"")
    }

    buildFeatures {
        buildConfig = true
    }

    NiaFlavorKt.configureFlavors(android) { pf, flavor ->
        pf.buildConfigField("String", "APP_FLAVOR_SUFFIX", "\"${flavor.applicationIdSuffix ?: ''}\"")
    }

    testOptions.managedDevices.localDevices.create("pixel6Api33") {
        device = "Pixel 6"
        apiLevel = 33
        systemImageSource = "aosp"
    }

    targetProjectPath = ":app"
    experimentalProperties["android.experimental.self-instrumenting"] = true
}

baselineProfile {
    managedDevices.clear()
    managedDevices.add("pixel6Api33")
    useConnectedDevices = false
}

dependencies {
    implementation(libs.androidx.benchmark.macro)
    implementation(libs.androidx.test.core)
    implementation(libs.androidx.test.espresso.core)
    implementation(libs.androidx.test.ext)
    implementation(libs.androidx.test.rules)
    implementation(libs.androidx.test.runner)
    implementation(libs.androidx.test.uiautomator)
}
