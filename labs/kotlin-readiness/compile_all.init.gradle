// Kotlin readiness probes: register `readinessCompileAll` in every project of the root build. It depends on every
// Kotlin compile task of that project (main, unit test and Android test sources, every variant), so one unqualified
// task name compiles all Kotlin code. Included builds (build-logic) are skipped.
// Each matched compile task logs (logger.lifecycle; println from parallel Isolated Projects configuration did not
// always reach the console), when it is configured, the language version it is set to ("unset" = the
// compiler's default). The dependency matches tasks by name only (TaskCollection.named(Spec)), so no other task is created:
// creating every task eagerly breaks plugins such as Dependency Guard. Isolated Projects safe: each hook touches only
// its own project.
gradle.lifecycle.beforeProject { p ->
    if (p.gradle.parent != null) return
    def kotlinCompiles = p.tasks.named { n -> n.startsWith("compile") && n.endsWith("Kotlin") }
    p.tasks.register("readinessCompileAll") { t -> t.dependsOn(kotlinCompiles) }
    p.tasks.configureEach { t ->
        if (t.name.startsWith("compile") && t.name.endsWith("Kotlin") && t.hasProperty("compilerOptions")) {
            def lv = t.compilerOptions.languageVersion.getOrNull()
            p.logger.lifecycle("LAB lv=" + (lv == null ? "unset" : lv.version) + " " + t.path)
        }
    }
}
